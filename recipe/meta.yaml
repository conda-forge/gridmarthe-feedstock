{% set name = "gridmarthe" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/gridmarthe/-/archive/v{{ version }}/gridmarthe-v{{ version }}.tar.gz
  sha256: e54921fc99e2cf54f4d7f118b96b38f69ba82a35c0308630165ea371905f438d

build:
  number: 2
  skip: true  # [py<311]
  entry_points:
    - ncmart = gridmarthe.scripts.ncmart:main
    - cleanmgrid = gridmarthe.scripts.cleanmgrid:main
    - martshp = gridmarthe.scripts.martshp:main

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - ninja
    - meson
  host:
    - python
    - pip
    - charset-normalizer
    - meson
    - meson-python
    - numpy <3.0
  run:
    - python
    - pandas <3.0
    - h5py
    - netcdf4
    - h5netcdf
    - xarray
    - geopandas
    - shapely
    - matplotlib-base

test:
  imports:
    - {{ name }}
  requires:
    - pip
#    - pytest
#  source_files:
#    - tests
  commands:
    - pip check
    - python -c "import gridmarthe"
#    - pytest tests/test_gridmarthe.py

about:
  home: https://gitlab.com/brgm/hydrogeological-modelling/marthe-tools/gridmarthe.git
  summary: 'Simple, fast read/write Python package for MartheGrids'
  description: |
    Full support of gridmarthe read operations by wrapping MARTHE fortran read/write module,
    allowing fast reading of marthe grid file (v9, v8, constant_data, etc.), for any variable.
    Release under GNU General Public License version 3.0
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  doc_url: 'https://gridmarthe.readthedocs.io/en/latest/'

extra:
  recipe-maintainers:
    - manlaya
